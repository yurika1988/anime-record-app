services:
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    environment:
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      DATABASE_URL: mysql://anime_user:anime_dev_password@mysql:3306/anime_record
      DATABASE_HOST: mysql
      DATABASE_PORT: "3306"
      DATABASE_NAME: anime_record
      DATABASE_USER: anime_user
      DATABASE_PASSWORD: anime_dev_password
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_dev_password
      MYSQL_DATABASE: anime_record
      MYSQL_USER: anime_user
      MYSQL_PASSWORD: anime_dev_password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_dev_password"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  frontend_node_modules:
  frontend_next:
  backend_node_modules:
  mysql_data:
